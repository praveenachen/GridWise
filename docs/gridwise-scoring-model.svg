<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img" aria-labelledby="title desc">
  <title id="title">GridWise Scoring Model</title>
  <desc id="desc">Five readiness dimensions feed an overall score, which produces explainable drivers and blockers.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2 L10 6 L2 10 Z" fill="#0f6b5b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163331" flood-opacity="0.12"/></filter>
    <style>
      .bg{fill:#f5f7f5}.dim{fill:#fff;stroke:#d9e1e0;stroke-width:2;filter:url(#shadow)}.score{fill:#e4f2ef;stroke:#0f6b5b;stroke-width:3;filter:url(#shadow)}.out{fill:#fff8e7;stroke:#d4b45f;stroke-width:2;filter:url(#shadow)}
      .title{font-family:"Space Grotesk","Segoe UI",Arial,sans-serif;fill:#1c2a2b;font-size:40px;font-weight:800}.sub{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;fill:#6b7b7d;font-size:20px}.label{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;fill:#1c2a2b;font-size:25px;font-weight:800}.small{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;fill:#6b7b7d;font-size:17px;font-weight:600}.line{stroke:#0f6b5b;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1500" height="720"/>
  <text class="title" x="70" y="78">Explainable Readiness Scoring</text>
  <text class="sub" x="70" y="112">Five visible dimensions feed the score instead of hiding the recommendation in a black box</text>
  <g transform="translate(100 170)">
    <rect class="dim" width="255" height="88" rx="18"/><text class="label" x="30" y="42">Market</text><text class="small" x="30" y="67">Demand + activity</text>
    <rect class="dim" y="108" width="255" height="88" rx="18"/><text class="label" x="30" y="150">Mobility</text><text class="small" x="30" y="175">Transit + safety + access</text>
    <rect class="dim" y="216" width="255" height="88" rx="18"/><text class="label" x="30" y="258">Infrastructure</text><text class="small" x="30" y="283">Servicing + capital timing</text>
    <rect class="dim" y="324" width="255" height="88" rx="18"/><text class="label" x="30" y="366">Policy</text><text class="small" x="30" y="391">OP + zoning alignment</text>
    <rect class="dim" y="432" width="255" height="88" rx="18"/><text class="label" x="30" y="474">Strategic</text><text class="small" x="30" y="499">Sequencing + priorities</text>
  </g>
  <path class="line" d="M370 214 C520 214 560 345 680 345"/>
  <path class="line" d="M370 322 C520 322 560 350 680 350"/>
  <path class="line" d="M370 430 H680"/>
  <path class="line" d="M370 538 C520 538 560 430 680 430"/>
  <path class="line" d="M370 646 C520 646 560 480 680 480"/>
  <rect class="score" x="690" y="300" width="310" height="180" rx="24"/>
  <text class="label" x="742" y="370">Overall Readiness</text>
  <text class="label" x="805" y="405">Score</text>
  <text class="small" x="755" y="440">Weighted by active lens</text>
  <path class="line" d="M1010 390 H1100"/>
  <rect class="out" x="1110" y="315" width="300" height="150" rx="22"/>
  <text class="label" x="1150" y="370">Drivers + Blockers</text>
  <text class="small" x="1150" y="405">Auditable explanation</text>
  <text class="small" x="1150" y="430">Evidence-backed actions</text>
</svg>
