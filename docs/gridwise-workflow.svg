<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">GridWise Planner Workflow</title>
  <desc id="desc">A six-step workflow: select area, review readiness, compare lenses, ask Planning Copilot, generate planning brief, decide next municipal action.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0f6b5b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#163331" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg{fill:#f5f7f5}.card{fill:#fff;stroke:#d9e1e0;stroke-width:2;filter:url(#shadow)}.hot{fill:#e4f2ef;stroke:#0f6b5b;stroke-width:2.5;filter:url(#shadow)}
      .title{font-family:"Space Grotesk","Segoe UI",Arial,sans-serif;fill:#1c2a2b;font-size:40px;font-weight:800}.sub{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;fill:#6b7b7d;font-size:20px}
      .label{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;fill:#1c2a2b;font-size:24px;font-weight:800}.small{font-family:"Source Sans 3","Segoe UI",Arial,sans-serif;fill:#6b7b7d;font-size:17px;font-weight:600}
      .line{stroke:#0f6b5b;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .num{fill:#0f6b5b;font-family:"Space Grotesk","Segoe UI",Arial,sans-serif;font-size:22px;font-weight:800}
    </style>
  </defs>
  <rect class="bg" width="1500" height="560"/>
  <text class="title" x="70" y="78">GridWise Planner Workflow</text>
  <text class="sub" x="70" y="112">From area selection to an explainable municipal action</text>
  <g transform="translate(70 215)">
    <rect class="card" width="190" height="130" rx="18"/><circle cx="35" cy="38" r="18" fill="#e4f2ef"/><text class="num" x="28" y="46">1</text><text class="label" x="28" y="82">Select Area</text><text class="small" x="28" y="110">Map or list</text>
  </g>
  <path class="line" d="M270 280 H330"/>
  <g transform="translate(340 215)">
    <rect class="card" width="190" height="130" rx="18"/><circle cx="35" cy="38" r="18" fill="#e4f2ef"/><text class="num" x="28" y="46">2</text><text class="label" x="28" y="82">Review</text><text class="label" x="28" y="110">Readiness</text>
  </g>
  <path class="line" d="M540 280 H600"/>
  <g transform="translate(610 215)">
    <rect class="card" width="210" height="130" rx="18"/><circle cx="35" cy="38" r="18" fill="#e4f2ef"/><text class="num" x="28" y="46">3</text><text class="label" x="28" y="82">Compare</text><text class="small" x="28" y="110">City / Developer</text>
  </g>
  <path class="line" d="M830 280 H890"/>
  <g transform="translate(900 215)">
    <rect class="card" width="195" height="130" rx="18"/><circle cx="35" cy="38" r="18" fill="#e4f2ef"/><text class="num" x="28" y="46">4</text><text class="label" x="28" y="82">Ask Copilot</text><text class="small" x="28" y="110">Planning questions</text>
  </g>
  <path class="line" d="M1105 280 H1165"/>
  <g transform="translate(1175 215)">
    <rect class="hot" width="220" height="130" rx="18"/><circle cx="35" cy="38" r="18" fill="#fff"/><text class="num" x="28" y="46">5</text><text class="label" x="28" y="82">Generate Brief</text><text class="small" x="28" y="110">Memo-ready output</text>
  </g>
  <path class="line" d="M1285 355 C1285 430 200 430 200 360"/>
  <g transform="translate(500 405)">
    <rect class="hot" width="500" height="78" rx="18"/><text class="label" x="35" y="48">6. Decide the next municipal action</text>
  </g>
</svg>
