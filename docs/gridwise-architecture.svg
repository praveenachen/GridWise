<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1040" viewBox="0 0 2100 1040" role="img" aria-labelledby="title desc">
  <title id="title">GridWise Technical System Architecture</title>
  <desc id="desc">Clean UML-style component architecture diagram for GridWise showing user interaction, Next.js frontend, API orchestration, deterministic readiness scoring, municipal planning data, evidence retrieval, planning copilot grounding, and explainable outputs.</desc>

  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfa"/>
      <stop offset="1" stop-color="#edf5f6"/>
    </linearGradient>

    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#0b6258"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4f7d5d"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L10 6 L2 10 Z" fill="#4f8ca3"/>
    </marker>

    <filter id="zoneShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#163331" flood-opacity="0.11"/>
    </filter>
    <filter id="cardShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#163331" flood-opacity="0.11"/>
    </filter>

    <style>
      .bg { fill: url(#pageBg); }
      .title { font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif; fill: #102f31; font-size: 42px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #557071; font-size: 20px; font-weight: 600; letter-spacing: 0; }
      .zone-title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #123a3b; font-size: 17px; font-weight: 800; letter-spacing: 0; text-transform: uppercase; }
      .zone-note { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #607879; font-size: 13px; font-weight: 600; letter-spacing: 0; }
      .component-title { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #162d2f; font-size: 15px; font-weight: 750; letter-spacing: 0; }
      .component-small { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #5e7375; font-size: 12px; font-weight: 650; letter-spacing: 0; }
      .arrow-label { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #45686a; font-size: 12px; font-weight: 750; letter-spacing: 0; }
      .footer { font-family: "Source Sans 3", "Segoe UI", Arial, sans-serif; fill: #46696b; font-size: 15px; font-weight: 650; letter-spacing: 0; }

      .zone { fill: #ffffff; stroke: #d7e3e2; stroke-width: 1.5; filter: url(#zoneShadow); }
      .zone-blue { fill: #eef7fb; stroke: #c9dfe7; stroke-width: 1.5; filter: url(#zoneShadow); }
      .zone-green { fill: #eff7f1; stroke: #c8dccd; stroke-width: 1.5; filter: url(#zoneShadow); }
      .zone-teal { fill: #edf7f5; stroke: #bdd8d3; stroke-width: 1.5; filter: url(#zoneShadow); }
      .zone-gray { fill: #f5f7f7; stroke: #d9e0e1; stroke-width: 1.5; filter: url(#zoneShadow); }

      .card { fill: #ffffff; stroke: #d5e1e0; stroke-width: 1.4; filter: url(#cardShadow); }
      .card-teal { fill: #ffffff; stroke: #8abbb2; stroke-width: 1.7; filter: url(#cardShadow); }
      .card-blue { fill: #ffffff; stroke: #a9cdda; stroke-width: 1.7; filter: url(#cardShadow); }
      .card-green { fill: #ffffff; stroke: #a7c9ad; stroke-width: 1.7; filter: url(#cardShadow); }
      .card-output { fill: #fffdf8; stroke: #ccd9d6; stroke-width: 1.6; filter: url(#cardShadow); }

      .pill { fill: #e5f2f0; stroke: #bfd8d4; stroke-width: 1; }
      .pill-blue { fill: #e7f3f8; stroke: #bfd8e2; stroke-width: 1; }
      .pill-green { fill: #e8f3ea; stroke: #bed5c4; stroke-width: 1; }
      .divider { stroke: #cbd9d8; stroke-width: 1; }

      .flow { fill: none; stroke: #0b6258; stroke-width: 2.2; marker-end: url(#arrowTeal); stroke-linecap: round; stroke-linejoin: round; }
      .flow-green { fill: none; stroke: #4f7d5d; stroke-width: 2.1; marker-end: url(#arrowGreen); stroke-linecap: round; stroke-linejoin: round; }
      .flow-blue { fill: none; stroke: #4f8ca3; stroke-width: 2.1; marker-end: url(#arrowBlue); stroke-linecap: round; stroke-linejoin: round; }
      .flow-soft { fill: none; stroke: #839da0; stroke-width: 1.8; marker-end: url(#arrowTeal); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect class="bg" width="2100" height="1040"/>

  <text class="title" x="70" y="70">GridWise Technical System Architecture</text>
  <text class="subtitle" x="70" y="103">AI-assisted growth, mobility readiness, and explainable planning workflow for municipal teams</text>

  <!-- User Interaction Layer -->
  <rect class="zone" x="60" y="210" width="190" height="220" rx="18"/>
  <text class="zone-title" x="84" y="241">User</text>
  <text class="zone-title" x="84" y="262">Interaction</text>
  <rect class="card-teal" x="88" y="287" width="134" height="86" rx="14"/>
  <circle cx="128" cy="319" r="16" fill="#d8ece9" stroke="#0b6258" stroke-width="1.5"/>
  <path d="M128 336 C104 336 100 356 100 356 H156 C156 356 152 336 128 336 Z" fill="#d8ece9" stroke="#0b6258" stroke-width="1.5"/>
  <text class="component-title" x="98" y="395">Planner /</text>
  <text class="component-title" x="98" y="416">User</text>

  <!-- Frontend -->
  <rect class="zone-blue" x="315" y="165" width="300" height="470" rx="22"/>
  <text class="zone-title" x="345" y="202">Next.js Frontend</text>
  <text class="zone-note" x="345" y="226">Interactive planning workspace</text>

  <rect class="card-blue" x="345" y="258" width="240" height="54" rx="12"/>
  <text class="component-title" x="369" y="291">Interactive Readiness Map</text>
  <rect class="card-blue" x="345" y="332" width="240" height="54" rx="12"/>
  <text class="component-title" x="369" y="365">Planning Workflow Dashboard</text>
  <rect class="card-blue" x="345" y="406" width="240" height="54" rx="12"/>
  <text class="component-title" x="369" y="439">City / Developer Lens Toggle</text>
  <rect class="card-blue" x="345" y="480" width="240" height="54" rx="12"/>
  <text class="component-title" x="369" y="513">Planning Copilot UI</text>
  <rect class="card-blue" x="345" y="554" width="240" height="54" rx="12"/>
  <text class="component-title" x="369" y="587">Planning Brief Generator</text>

  <!-- Application / API -->
  <rect class="zone-teal" x="690" y="165" width="330" height="340" rx="22"/>
  <text class="zone-title" x="720" y="202">Application / API Layer</text>
  <text class="zone-note" x="720" y="226">Request routing and workflow control</text>

  <rect class="card-teal" x="720" y="258" width="270" height="56" rx="12"/>
  <text class="component-title" x="750" y="292">Next.js API Routes</text>
  <rect class="card-teal" x="720" y="336" width="270" height="56" rx="12"/>
  <text class="component-title" x="750" y="370">Workflow State Manager</text>
  <rect class="card-teal" x="720" y="414" width="270" height="72" rx="12"/>
  <text class="component-title" x="750" y="447">Planning Workflow</text>
  <text class="component-title" x="750" y="468">Orchestrator</text>

  <!-- Municipal Planning Data -->
  <rect class="zone-gray" x="1110" y="165" width="300" height="485" rx="22"/>
  <text class="zone-title" x="1140" y="202">Municipal Planning Data</text>
  <text class="zone-note" x="1140" y="226">Sample inputs, signals, and configs</text>

  <rect class="card" x="1140" y="258" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="284">Sample Growth Areas</text>
  <rect class="card" x="1140" y="313" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="339">Mobility Indicators</text>
  <rect class="card" x="1140" y="368" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="394">Transit Access Signals</text>
  <rect class="card" x="1140" y="423" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="449">Infrastructure Constraints</text>
  <rect class="card" x="1140" y="478" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="504">Policy / Official Plan Evidence</text>
  <rect class="card" x="1140" y="533" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="559">Safety + Connectivity Signals</text>
  <rect class="card" x="1140" y="588" width="240" height="40" rx="10"/>
  <text class="component-title" x="1164" y="614">Lens Weight Configs</text>

  <!-- Evidence Retrieval -->
  <rect class="zone-blue" x="1485" y="165" width="300" height="410" rx="22"/>
  <text class="zone-title" x="1515" y="202">Evidence Retrieval Layer</text>
  <text class="zone-note" x="1515" y="226">Visible grounding pipeline</text>

  <rect class="card-blue" x="1515" y="258" width="240" height="54" rx="12"/>
  <text class="component-title" x="1540" y="291">JSONL Evidence Files</text>
  <rect class="card-blue" x="1515" y="338" width="240" height="54" rx="12"/>
  <text class="component-title" x="1540" y="371">Planning Evidence Index</text>
  <rect class="card-blue" x="1515" y="418" width="240" height="54" rx="12"/>
  <text class="component-title" x="1540" y="451">Evidence Ranking</text>
  <rect class="card-blue" x="1515" y="498" width="240" height="54" rx="12"/>
  <text class="component-title" x="1540" y="531">Grounded Evidence Snippets</text>

  <!-- Readiness Scoring Engine -->
  <rect class="zone-green" x="690" y="720" width="720" height="250" rx="22"/>
  <text class="zone-title" x="720" y="757">Readiness Scoring Engine</text>
  <text class="zone-note" x="720" y="781">Deterministic scoring layer</text>

  <rect class="card-green" x="720" y="810" width="250" height="74" rx="14"/>
  <text class="component-title" x="748" y="843">Composite Readiness</text>
  <text class="component-title" x="748" y="864">Calculator</text>

  <rect class="pill-green" x="720" y="894" width="250" height="52" rx="12"/>
  <text class="component-small" x="744" y="916">overall score / score band</text>
  <text class="component-small" x="744" y="934">driver / blocker summary</text>

  <rect class="card-green" x="1015" y="792" width="160" height="48" rx="12"/>
  <text class="component-title" x="1040" y="821">Market</text>
  <rect class="card-green" x="1195" y="792" width="160" height="48" rx="12"/>
  <text class="component-title" x="1220" y="821">Mobility</text>
  <rect class="card-green" x="1015" y="856" width="160" height="48" rx="12"/>
  <text class="component-title" x="1040" y="885">Infrastructure</text>
  <rect class="card-green" x="1195" y="856" width="160" height="48" rx="12"/>
  <text class="component-title" x="1220" y="885">Policy</text>
  <rect class="card-green" x="1015" y="908" width="160" height="56" rx="12"/>
  <text class="component-title" x="1040" y="932">Strategic</text>
  <text class="component-title" x="1040" y="950">Alignment</text>
  <rect class="card-green" x="1195" y="914" width="160" height="44" rx="12"/>
  <text class="component-title" x="1220" y="942">Weight Engine</text>
  <rect class="pill-green" x="1000" y="758" width="370" height="24" rx="12"/>
  <text class="component-small" x="1088" y="775">Weighted readiness inputs</text>

  <!-- Planning Copilot -->
  <rect class="zone-teal" x="1485" y="620" width="300" height="360" rx="22"/>
  <text class="zone-title" x="1515" y="657">Planning Copilot Layer</text>
  <text class="zone-note" x="1515" y="681">Grounded generation and validation</text>

  <rect class="pill-blue" x="1515" y="707" width="240" height="74" rx="12"/>
  <text class="component-small" x="1539" y="731">Context inputs</text>
  <text class="component-small" x="1539" y="752">area / lens / scores / constraints</text>
  <text class="component-small" x="1539" y="772">evidence snippets / project profile</text>

  <rect class="card-teal" x="1515" y="800" width="240" height="48" rx="12"/>
  <text class="component-title" x="1540" y="830">Context Builder</text>
  <rect class="card-teal" x="1515" y="864" width="240" height="48" rx="12"/>
  <text class="component-title" x="1540" y="894">Prompt Templates</text>
  <rect class="card-teal" x="1515" y="928" width="240" height="48" rx="12"/>
  <text class="component-title" x="1540" y="949">LLM / Fallback</text>
  <text class="component-small" x="1540" y="966">Engine</text>

  <!-- Explainable Outputs -->
  <rect class="zone" x="1815" y="620" width="240" height="360" rx="22"/>
  <text class="zone-title" x="1845" y="657">Explainable Outputs</text>
  <text class="zone-note" x="1845" y="681">Auditable planning artifacts</text>
  <rect class="card-output" x="1845" y="708" width="180" height="42" rx="10"/>
  <text class="component-small" x="1864" y="733">Readiness Scorecard</text>
  <rect class="card-output" x="1845" y="761" width="180" height="42" rx="10"/>
  <text class="component-small" x="1864" y="786">Drivers + Blockers</text>
  <rect class="card-output" x="1845" y="814" width="180" height="42" rx="10"/>
  <text class="component-small" x="1864" y="839">Municipal Actions</text>
  <rect class="card-output" x="1845" y="867" width="180" height="42" rx="10"/>
  <text class="component-small" x="1864" y="892">Generated Planning Brief</text>
  <rect class="card-output" x="1845" y="920" width="180" height="50" rx="10"/>
  <text class="component-small" x="1864" y="942">Grounded Copilot</text>
  <text class="component-small" x="1864" y="958">Response</text>

  <!-- Clean data-flow lanes -->
  <path class="flow" d="M250 320 H315"/>

  <path class="flow" d="M615 395 H690"/>

  <path class="flow" d="M1020 365 H1110"/>

  <path class="flow-blue" d="M1410 388 H1485"/>

  <path class="flow-blue" d="M1635 312 V338"/>
  <path class="flow-blue" d="M1635 392 V418"/>
  <path class="flow-blue" d="M1635 472 V498"/>

  <path class="flow-green" d="M1260 650 V720"/>

  <path class="flow-green" d="M855 505 V720"/>

  <path class="flow-blue" d="M1635 552 V620"/>

  <path class="flow" d="M990 450 H1050 V694 H1460 V744 H1515"/>

  <path class="flow-green" d="M1410 824 H1515"/>

  <path class="flow-soft" d="M1380 498 H1436 V744 H1515"/>

  <path class="flow" d="M1755 824 H1815"/>


  <line class="divider" x1="70" y1="990" x2="2030" y2="990"/>
  <text class="footer" x="70" y="1022">Design principle: scores, weights, assumptions, evidence, and AI outputs remain visible so the workflow stays explainable and auditable.</text>
</svg>
